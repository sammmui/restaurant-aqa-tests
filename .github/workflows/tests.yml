
name: AQA tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      UI_URL: ${{ vars.UI_URL }}
      API_URL: ${{ vars.API_URL }}
      WAITER_USERNAME: ${{ secrets.WAITER_USERNAME }}
      WAITER_PASSWORD: ${{ secrets.WAITER_PASSWORD }}
      HEADLESS: "true"
      ARTIFACTS_DIR: ${{ github.workspace }}/TestResults
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build ./restaurant-aqa-framework.csproj

      - name: Install Playwright browsers
        run: pwsh bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run tests
        continue-on-error: true
        run: dotnet run --no-build --project ./restaurant-aqa-framework.csproj

      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**
          if-no-files-found: warn
